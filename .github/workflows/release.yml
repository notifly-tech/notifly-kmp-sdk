name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0-alpha.3
      open_android_pr:
        description: Open an Android SDK submodule-bump PR
        type: boolean
        default: true
      open_ios_pr:
        description: Open an iOS SDK submodule-bump PR
        type: boolean
        default: true
      open_js_pr:
        description: Open a JavaScript SDK submodule-bump PR
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: notifly-kmp-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
    steps:
      - name: Validate cross-repository PR credentials
        env:
          OPEN_ANDROID_PR: ${{ inputs.open_android_pr }}
          OPEN_IOS_PR: ${{ inputs.open_ios_pr }}
          OPEN_JS_PR: ${{ inputs.open_js_pr }}
        run: |
          if [[ "$OPEN_ANDROID_PR" == "true" || "$OPEN_IOS_PR" == "true" || "$OPEN_JS_PR" == "true" ]]; then
            if [[ -z "$SDK_REPO_TOKEN" ]]; then
              echo "SDK_REPO_TOKEN is required with Contents and Pull requests write access to the platform SDKs." >&2
              exit 1
            fi
          fi

  release:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.tag }}
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate version
        id: version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect existing release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            git merge-base --is-ancestor "$tag_commit" origin/main
            git checkout --detach "$tag"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "github_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        run: |
          ./gradlew \
            jvmTest \
            jsNodeTest \
            iosSimulatorArm64Test \
            publishToMavenLocal \
            packJsPackage \
            assembleNotiflyKMPReleaseXCFramework \
            --no-daemon

      - name: Smoke-test artifacts
        run: |
          scripts/smoke-maven-local.sh
          node scripts/smoke-js-package.mjs "build/packages/notifly-kmp-sdk-$VERSION.tgz"
          scripts/smoke-apple-artifacts.sh

      - name: Prepare release archive and manifests
        id: apple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$PWD/build/release/$VERSION"
          archive="$release_dir/NotiflyKMP.xcframework.zip"
          mkdir -p "$release_dir"

          if [[ "${{ steps.release-state.outputs.github_release_exists }}" == "true" ]]; then
            gh release download "v$VERSION" \
              --pattern "NotiflyKMP.xcframework.zip" \
              --dir "$release_dir" \
              --clobber
            checksum="$(swift package compute-checksum "$archive")"
          else
            output="$(SKIP_BUILD=true scripts/prepare_release.sh "$VERSION")"
            archive="$(printf '%s\n' "$output" | sed -n '1p')"
            checksum="$(printf '%s\n' "$output" | sed -n '2p')"
          fi

          if [[ "${{ steps.release-state.outputs.tag_exists }}" == "true" ]]; then
            grep -F "checksum: \"$checksum\"" Package.swift >/dev/null
            grep -F ":sha256 => \"$checksum\"" NotiflyKMP.podspec >/dev/null
          else
            scripts/update_release_manifests.rb "$VERSION" "$checksum"
          fi

          printf '%s  %s\n' "$checksum" "$(basename "$archive")" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Commit versioned manifests
        if: steps.release-state.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift NotiflyKMP.podspec
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare v$VERSION"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        if: steps.release-state.outputs.github_release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "${{ steps.apple.outputs.archive }}" \
            "build/release/$VERSION/NotiflyKMP.xcframework.zip.sha256" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --generate-notes \
            --title "v$VERSION"

      - name: Restore checksum asset on an existing release
        if: steps.release-state.outputs.github_release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" \
            "build/release/$VERSION/NotiflyKMP.xcframework.zip.sha256" \
            --clobber

  bump-android:
    needs: release
    if: ${{ inputs.open_android_pr }}
    uses: ./.github/workflows/bump-sdk-submodule.yml
    with:
      sdk_repository: team-michael/notifly-android-sdk
      kmp_version: ${{ needs.release.outputs.version }}
    secrets:
      SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}

  bump-ios:
    needs: release
    if: ${{ inputs.open_ios_pr }}
    uses: ./.github/workflows/bump-sdk-submodule.yml
    with:
      sdk_repository: team-michael/notifly-ios-sdk
      kmp_version: ${{ needs.release.outputs.version }}
    secrets:
      SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}

  bump-js:
    needs: release
    if: ${{ inputs.open_js_pr }}
    uses: ./.github/workflows/bump-sdk-submodule.yml
    with:
      sdk_repository: team-michael/notifly-js-sdk
      kmp_version: ${{ needs.release.outputs.version }}
    secrets:
      SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
